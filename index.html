  <script>
    // Áp dụng giao diện đã chọn trước khi vẽ trang (tránh nháy màu)
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('bnth.prefs') || '{}'), r = document.documentElement;
        var dark = p.theme === 'dark' || ((!p.theme || p.theme === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches);
        r.dataset.theme = dark ? 'dark' : 'light'; r.dataset.size = p.size || 'm'; r.dataset.accent = p.accent || 'teal';
      } catch (e) {}
    })();
  </script>
